<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XLRI BM 24–26 | The Yearbook</title>
<meta name="description" content="XLRI Jamshedpur PGDM-BM Batch of 2026 digital yearbook.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient"></div>
<main id="app">
  <section id="cover" class="screen cover-screen active">
    <div class="cover-book">
      <div class="cover-stamp">XLRI Jamshedpur</div>
      <div class="cover-mark">XLRI</div>
      <p class="eyebrow">PGDM-BM • BLENDED LEARNING</p>
      <h1>Batch<br><em>of 2026</em></h1>
      <p class="cover-line">38 people. One journey. A thousand little memories.</p>
      <p class="cover-subline">Our people. Our stories. Our memories.</p>
      <div class="cover-rule"></div>
      <p class="cover-small">XLRI Jamshedpur · BM 24–26</p>
      <button id="openBtn" class="primary-btn">Open the Yearbook <span>→</span></button>
    </div>
  </section>

  <section id="book" class="screen book-screen" aria-label="Digital yearbook">
    <header class="topbar">
      <button class="brand-btn" id="homeBtn" aria-label="Back to cover"><span>XLRI</span><small>BM 24–26</small></button>
      <div class="top-actions">
        <button class="ghost-btn" id="indexBtn">☰ <span>Index</span></button>
        <button class="ghost-btn" id="memoryBtn">✦ <span>Memory Wall</span></button>
      </div>
    </header>

    <div class="book-stage">
      <div class="book-shadow"></div>
      <div id="bookSheet" class="book-sheet" tabindex="0">
        <div id="sheetContent" class="sheet-content"></div>
        <div id="turnOverlay" class="turn-overlay" aria-hidden="true"></div>
      </div>
    </div>

    <div class="book-controls">
      <button id="prevBtn" class="nav-btn">← <span>Previous</span></button>
      <div class="counter"><strong id="counter">1 / 42</strong><span>pages</span></div>
      <button id="nextBtn" class="nav-btn"><span>Next</span> →</button>
    </div>
    <div class="hint">Use ← →, swipe, or the controls to turn the pages</div>
  </section>

  <section id="indexScreen" class="screen overlay-screen">
    <div class="panel index-panel">
      <div class="panel-head">
        <div><p class="eyebrow">EXPLORE THE BOOK</p><h2>Yearbook Index</h2></div>
        <button class="close-btn" id="closeIndex">×</button>
      </div>
      <div class="search-wrap"><span>⌕</span><input id="searchInput" type="search" placeholder="Search a name…" autocomplete="off"></div>
      <div id="indexGrid" class="index-grid"></div>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
